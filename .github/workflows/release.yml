name: SentinelLog Release Orchestration

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  stage-and-smoke:
    name: Deploy to Staging & Run Smoke Tests
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Tag Immutable Image
        run: |
          IMAGE_TAG=${GITHUB_REF_NAME}
          echo "Building image tag: ${IMAGE_TAG}"
          docker build -t sentinellog:${IMAGE_TAG} .

      - name: Deploy Image to Staging ECS
        run: |
          echo "Deploying ${GITHUB_REF_NAME} to Staging ECS Fargate..."

      - name: Run Staging Smoke Tests
        run: |
          python -m pytest tests/test_deployment.py -k "test_smoke"

  production-gate:
    name: Production Release Promotion Gate
    needs: stage-and-smoke
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sentinellog.internal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production ECS Fargate (Rolling Update)
        run: |
          echo "Promoting approved release ${GITHUB_REF_NAME} to Production ECS..."

      - name: Verify Production Health & Readiness
        run: |
          echo "Validating production /health/live and /health/ready endpoints..."
