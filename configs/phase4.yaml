# SentinelLog Phase 4 Configuration: Learned Scorer + Conformal Selective Gate
version: "0.4.0-phase4"

# Datasets to process (strictly TRAIN and CALIBRATION)
datasets:
  - hdfs
  - bgl

data_dirs:
  hdfs: "data/processed/hdfs"
  bgl: "data/processed/bgl"

output_dir: "results/phase4"

random_seed: 42

# B2 Sequential GRU Architecture (<2,000,000 parameters)
model:
  embedding_dim: 32
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1
  max_seq_len: 100

# Training Protocol (TRAIN partition only)
training:
  train_normal_only: true     # Filter anomalies from TRAIN to learn normal workflows
  val_ratio: 0.10             # Internal chronological 90/10 split of TRAIN for early stopping
  batch_size: 64
  epochs: 20
  patience: 3
  learning_rate: 0.001
  weight_decay: 0.0001

# Split Conformal Calibration Parameters
conformal:
  alpha_grid:
    - 0.01
    - 0.05
    - 0.10
    - 0.20
  strict: true                # Strict inequality score > threshold for tied discrete scores

# Ablation Experiments
ablations:
  fixed_quantile: 0.95        # Ablation A: Fixed heuristic threshold vs Conformal Gate
  calibration_sizes:          # Ablation C: Calibration sample size sensitivity
    - 0.25
    - 0.50
    - 1.00
