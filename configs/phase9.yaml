# SentinelLog Phase 9: LLM Explanation & Orchestration Configuration

provider:
  type: "mock"
  model: "sentinellog-mock-v1"
  mock_mode: "default"
  api_key_env: "SENTINELLOG_LLM_API_KEY"

temperature: 0.0
max_tokens: 1000

client:
  timeout: 30.0
  max_retries: 2

prompt_version: "v1.0"

citation_requirements:
  strict_provenance: true
  min_citations_for_factual: 1

faithfulness_thresholds:
  min_coverage: 0.50
  min_lexical_overlap: 0.05

claim_limits:
  max_claims: 10
  allowed_types:
    - "OBSERVATION"
    - "EVIDENCE"
    - "CORRELATION"
    - "INTERPRETATION"
    - "UNCERTAINTY"
    - "RECOMMENDATION"

token_limits:
  max_input_tokens: 4000
  max_output_tokens: 1000

abstention_policy:
  abstain_on_validation_failure: true
  abstain_on_provider_error: true
  abstain_on_unverified_provenance: true

paths:
  phase7_dir: "results/phase7"
  phase8_dir: "results/phase8"
  output_dir: "results/phase9"
